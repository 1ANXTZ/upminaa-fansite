<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>404 | Upminaa Fan Hub</title>


<meta name="description" content="Page not found - Upminaa Fan Hub">


<link 
rel="icon"
type="image/png"
href="./assets/images/favicon.png"
>


<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap');


:root {
    --bg: #09090f;
    --card: #11111b;
    --purple: #8b5cf6;
    --light-purple: #c084fc;
    --text: #ffffff;
    --muted: #a1a1aa;
}


* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body {

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    radial-gradient(circle at top, #7c3aed33, transparent 40%),
    var(--bg);

    font-family:'Rajdhani', sans-serif;

    color:var(--text);

    overflow:hidden;

}



.container {

    width:min(90%, 500px);

    text-align:center;

    background:rgba(17,17,27,.85);

    border:1px solid rgba(139,92,246,.35);

    padding:45px 35px;

    border-radius:25px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 40px rgba(139,92,246,.25);

}



.logo {

    width:120px;

    height:120px;

    object-fit:cover;

    border-radius:25px;

    margin-bottom:25px;

    box-shadow:
    0 0 25px rgba(168,85,247,.7);

}



.error-code {

    font-family:'Orbitron', sans-serif;

    font-size:80px;

    font-weight:900;

    color:var(--purple);

    text-shadow:
    0 0 15px rgba(139,92,246,.8);

}



h1 {

    font-family:'Orbitron', sans-serif;

    font-size:28px;

    margin-bottom:15px;

}



p {

    color:var(--muted);

    font-size:18px;

    line-height:1.5;

    margin-bottom:30px;

}



.home-btn {

    display:inline-block;

    padding:14px 35px;

    border-radius:30px;

    background:linear-gradient(
    135deg,
    #7c3aed,
    #a855f7
    );

    color:white;

    text-decoration:none;

    font-weight:700;

    font-size:18px;

    transition:.3s;

}



.home-btn:hover {

    transform:translateY(-4px);

    box-shadow:
    0 0 25px rgba(168,85,247,.8);

}



.footer {

    margin-top:25px;

    font-size:14px;

    color:#71717a;

}



</style>


</head>


<body>


<main class="container">


<img 
src="./assets/images/favicon.png"
alt="Upminaa Fan Hub"
class="logo"
>


<div class="error-code">
404
</div>


<h1>
Oops! Wrong Page
</h1>


<p>
The page you are looking for does not exist or may have been moved.
</p>



<a 
href="./index.html"
class="home-btn"
>
Return to Upminaa Fan Hub
</a>



<div class="footer">
Unofficial fan-made community project
</div>



</main>


</body>

</html>
